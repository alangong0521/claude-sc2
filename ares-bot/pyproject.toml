# NOTE: `name` intentionally kept as the original template value. Poetry derives the
# virtualenv id from this name; renaming it orphans the existing installed env and
# forces a full (slow, cython-compiling) reinstall. Brand identity lives in the README.
[tool.poetry]
name = "ares-sc2-starter-bot"
version = "0.1.0"
description = "code-agent-sc2 — commanding StarCraft II with a local coding agent; a 0-APM RTS experiment."
authors = ["hankyuan <neiyohank@gmail.com>"]
readme = "README.md"
packages = [{include = "ares-sc2/src/ares"}]

[tool.poetry.dependencies]
ares-sc2 = { path = "ares-sc2", develop = false }
python = ">=3.11, <3.13"
black = "^23.1.0"
isort = "^5.12.0"
requests = "^2.32.3"
leitwerk = ">=0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
extend-exclude = 'ares-sc2/*'

[tool.isort]
profile = "black"
skip_glob = ["ares-sc2/*"]
