# 军队组成配置 —— 兵种单一真相源(per-race,全兵种登记)
#
# ProductionManager(造什么兵)和 CombatManager(指挥哪些兵、用哪个 combat class)按 bot
# 自己的种族(ai.race)读对应块。改这里就能调 bot 支持的兵种,不用动 Python。
#
# 顶层 = 三个种族块 protoss/terran/zerg;每块 units 列表 + 可选 upgrades 列表。每个兵种:
#   id:        引擎枚举名(sc2 UnitTypeId),全大写,如 TEMPEST / MARINE / ROACH
#   proportion: 该兵种目标占比(0~1)。**同一块内 >0 的占比之和应 ≤1.0**。
#              proportion=0 = "已登记但不入产":CombatManager 会指挥它(若场上有),但
#              SpawnController 不造它(spawn_dict 只收 >0)。想真正混编就把它调 >0。
#   priority:   造兵优先级(整数,越小越优先;0=最高)。默认 5。
#   role:       ares UnitRole 名(ATTACKING 归 CombatManager 指挥 / HARASSING 归 OracleManager)
#   combat:     指挥方式(combat class),见 army_config.COMBAT_KINDS:
#       default           = 通用 attack-move+基础风筝(generic_offensive),任意战斗单位可用(兜底)
#       tempest_offensive/oracle_harass/siege_offensive/medivac_support/medivac_transport/
#       templar_caster/ghost_offensive/raven_support/queen_support/reaper_harass/infestor_caster
#         = 各兵种专属(借 ares 原语)。没专属类的就用 default。
#   notes:     人话备注
#
# ⚠️ 全兵种已登记(control-ready),但**都是离线骨架,没跑过游戏**:
#  1. combat=default/专属类的交战手感、技能时机全部**未跑局验证**(B0/M4)。
#  2. 各种族生产层:Protoss 已验证(TEMPEST),Terran M1 骨架,Zerg M2 骨架(缺注卵)。
#  3. 兵种需对应科技建筑才能真正造出(TechUp 会自动补);proportion=0 的只是"能指挥",不占产能。
#  详见 docs/status-and-roadmap.md。

protoss:
