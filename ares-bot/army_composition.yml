# 军队组成配置 —— 兵种单一真相源(per-race)
#
# ProductionManager(造什么兵)和 CombatManager(指挥哪些兵、用哪个 combat class)按 bot
# 自己的种族(ai.race)读对应块。改这里就能调 bot 支持的兵种,不用动 Python。
#
# 顶层 = 三个种族块 protoss/terran/zerg;每块一个 units 列表。每个兵种:
#   id:        引擎枚举名(sc2 UnitTypeId),全大写,如 TEMPEST / MARINE / ROACH
#   proportion: 该兵种目标占比(0~1)。**同一块内 >0 的占比之和应 ≤1.0**。
#              proportion=0 = "已登记但不入产":CombatManager 会指挥它(若场上有),但
#              SpawnController 不造它(spawn_dict 只收 >0)。想真正混编就把它调 >0。
#   priority:   造兵优先级(整数,越小越优先;0=最高)
#   role:       ares UnitRole 名(ATTACKING 归 CombatManager 指挥 / HARASSING 归 OracleManager)
#   combat:     指挥方式,决定用哪个 combat class:
#       tempest_offensive = 暴风舰远射风筝(BaseUnit 专属类)
#       oracle_harass     = 先知骚扰(OracleManager 单独管,CombatManager 不收)
#       default           = 通用 attack-move + 基础风筝(generic_offensive),任意兵种可用
#   notes:     人话备注
#
# ⚠️ 两条硬约束(加兵种前必读,细节见 docs/status-and-roadmap.md「多兵种/多种族」):
#  1. combat=default 的交战手感(风筝距离/集火/寻路)**未跑局验证**(B0)。
#  2. **只有 protoss 块当前能真正出兵**:bot 默认 Protoss,且 ProductionManager 的
#     科技建筑逻辑是 Protoss 专属。terran/zerg 块要真正 field,需(a)把 BOT_RACE 切成该
#     种族,(b)补该种族的生产/科技层(Terran 可用 ares ProductionController;Zerg 不支持
#     ProductionController,得靠 build order/自定义)。在那之前 terran/zerg 块是**控制层
#     就绪的前瞻配置**,不是能打的 bot。

protoss:
  units:
    # —— 已验证主力(保持原样,勿轻改)——
    - id: TEMPEST
      proportion: 1.0
      priority: 0
      role: ATTACKING
      combat: tempest_offensive
      notes: 主力天空体,射程极远,地面兵够不着。死穴=凤凰。
    - id: ORACLE
      proportion: 0.0
      priority: 9
      role: HARASSING
      combat: oracle_harass
      notes: 顺路骚扰农民。OracleManager 单独造(一次性一个),不进 SpawnController 混编。

    # —— 备选兵种(control-ready,proportion=0 默认不入产;调 >0 即混编,需对应科技+跑局验证)——
    - id: STALKER
      proportion: 0.0
      priority: 1
      role: ATTACKING
      combat: default
      notes: 追猎,通用地面/对空。补暴风舰被凤凰克时的对空火力。需 GATEWAY+控制核心。
    - id: VOIDRAY
      proportion: 0.0
      priority: 2
      role: ATTACKING
      combat: default
      notes: 虚空,对重甲/巨像好用,与暴风舰同走星门科技(STARGATE 已在造)。
    - id: IMMORTAL
      proportion: 0.0
      priority: 2
      role: ATTACKING
      combat: default
      notes: 不朽,对重甲。需 ROBOTICSFACILITY(当前 build 默认不造,先 build=robo)。
    - id: HIGHTEMPLAR
      proportion: 0.0
      priority: 3
      role: ATTACKING
      combat: templar_caster
      notes: 高模,M4 combat=templar_caster(ares UseAOEAbility 放灵能风暴);需 TWILIGHT+TEMPLARARCHIVE。未跑局验证。
  # 该种族要研究的升级(引擎 UpgradeId 名,全大写)。Protoss 保持原 3 项 → 行为不变。
  # 名字认不出会在运行时静默跳过(bot 侧 getattr 兜底)。
  upgrades:
    - TEMPESTGROUNDATTACKUPGRADE
    - PROTOSSAIRARMORSLEVEL1
    - PROTOSSAIRARMORSLEVEL2

# ⚠️ 以下 terran/zerg 为前瞻配置:需切 BOT_RACE + 补生产层才能真正出兵(见文件头约束 2)。
terran:
  units:
    - id: MARINE
      proportion: 0.5
      priority: 1
      role: ATTACKING
      combat: default
      notes: 枪兵,生化核心。真正拉扯要 stutter_unit_back(default 目前只平A+基础风筝)。
    - id: MARAUDER
      proportion: 0.2
      priority: 1
      role: ATTACKING
      combat: default
      notes: 掠夺者,对重甲。需 barracks+techlab。
    - id: SIEGETANK
      proportion: 0.2
      priority: 0
      role: ATTACKING
      combat: siege_offensive
      notes: 攻城坦克。M4 专属 combat=siege_offensive(ares SiegeTankDecision 自动架/撤);未跑局验证。
    - id: MEDIVAC
      proportion: 0.1
      priority: 2
      role: ATTACKING
      combat: medivac_support
      notes: 医疗运输。M4 专属 combat=medivac_support(ares MedivacHeal 治疗跟队);运兵/未跑局验证。
  upgrades:
    - TERRANINFANTRYWEAPONSLEVEL1
    - TERRANINFANTRYARMORSLEVEL1
    - STIMPACK

zerg:
  units:
    - id: ZERGLING
      proportion: 0.3
      priority: 2
      role: ATTACKING
      combat: default
      notes: 小狗,便宜围杀。Zerg 不支持 ProductionController,出兵靠 build order/自定义。
    - id: ROACH
      proportion: 0.4
      priority: 1
      role: ATTACKING
      combat: default
      notes: 蟑螂,肉盾主力。需 ROACHWARREN。
    - id: HYDRALISK
      proportion: 0.3
      priority: 1
      role: ATTACKING
      combat: default
      notes: 刺蛇,远程对空/对地。需 HYDRALISKDEN。
  upgrades:
    - ZERGMISSILEWEAPONSLEVEL1
    - ZERGGROUNDARMORSLEVEL1
