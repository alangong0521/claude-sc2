# 流派配置 —— 神族生产侧单一真相源(per-flow)
#
# ProductionManager 按 BUILD env 选流派(默认 tempest,未知名回退 tempest 并警告),
# 造兵配方/科技链/升级/chrono/追加产能全从本文件读。加流派 = 加一块 yaml,不动 Python。
#
# 每个流派字段:
#   spawn:            造兵配方 {引擎兵种名(全大写): {proportion, priority}}
#                     proportion 和应 ≈ 1.0;priority 越小越优先(0=主力,chrono/primary 判断用它)
#   core_structures:  有序科技链(引擎结构名)。FLEETBEACON 是特例:需有就绪星门才建
#                     (tech_requirement_progress 对它不准,代码按 id 特判)
#   upgrades:         升级列表(引擎 UpgradeId 名),交 ares UpgradeController(自动补科技建筑)
#   extra_production: 矿富余(>400)时追加的产兵建筑 {id, cap, base}
#                     desired = min(cap, base + 已就绪基地数);GATEWAY 计数含 WARPGATE(代码特判)
#   chrono:           {targets: [...], when: always|primary_pending}
#                     targets 按顺序取第一个有建筑的;always=见忙就加速,
#                     primary_pending=主力在产才加速(省能量给一次性建造首次加速)
#   one_off:          一次性建造(如 ORACLE,需舰队航标+空闲就绪星门,造一个即停)
#   rally_min_army:   集结阈值(整数,缺省 0=关)。>0 时,兵力低于它且司令没下 stance
#                     命令,部队先守家攒兵不主动压上(治 trickle-feed 分批送死)
#   auto_expand:      两种模式(缺省关)。旧式 {at, to, when_workers}:到点扩到 to 个;
#                     动态 {max_bases, when_workers, advantage_supply}(E2,carrier):
#                     爆仓(农民 ≥ when_workers×基地数)或前线优势(我方 army supply ≥
#                     敌可见 + advantage_supply)时逐矿 +1,上限 max_bases,rush 期间不开
#   expansion_cannons: {min, max}(缺省无=固定 2 塔/矿)。E2 分矿塔数动态:
#                     photon_cannons_per_base = clamp(min, min + 敌可见作战单位//4, max)
#   pre_fleet:        {id, cap, per_enemy, max}(缺省无=关)。E3e 舰队成型前地面保底:
#                     舰队主 C 出生前混入 id 兵种(矿耗地面兵,不吃气)到 spawn;
#                     上限 = clamp(cap, 敌可见作战单位×per_enemy, max)(E3f 伸缩,
#                     max=0 时固定 cap);主 C 上线自动退出。保底兵种 save_up 不截断
#   freeflow:         true|false(缺省 false)。true = SpawnController 不按配比卡产
#                     (配比只当优先序不当上限)——多兵种流派必开,否则兵力在
#                     精确配比点永久死锁(单兵种流派靠 over_produce 豁免,不用开)
#   pivot:            自适应机制(缺省关)。字段:
#                       anti_air_units/anti_air_proportion/anti_air_trigger:
#                         敌可见空军 ≥trigger 时 spawn 混入对空兵种
#                       rush_zealots: rush 检测成立时先顶出的叉子数(0=不出叉子,臂 C)
#                       rush_cannons: true|false(缺省 true)。rush 预警时是否提前铺塔
#                         —— E1 实验开关:臂 A=4叉+铺塔(默认),臂 B=rush_cannons: false
#                         (纯叉子不铺塔),臂 C=rush_zealots: 0(只铺塔憋航母)
#   save_up:          憋气阈值(整数气,缺省 0=关)。O5:freeflow 下 p0 买不起会被
#                     p1 fall-through 吃掉气,永远攒不出 p0。>0 时:p0 占比落后且
#                     (买得起 或 气缺口 ≤ 此值) → 截断低优先生成攒气;p0 占比 ≥ 配比
#                     → p0 让位,p1 照常补位。阈值建议 ≥ p0 气价 - p1 气价
#                     (航母 250/风暴 175 → 250 即"占比落后就全力攒")
#
# ⚠️ tempest/stalker 两块与已验证行为逐位一致,勿轻改(有 shipped 测试冻结,见
#    tests/test_flow_config.py)。战斗侧指挥不读本文件 —— CombatManager 按
#    army_composition.yml 兵种注册表逐兵种分派,流派无关。

flows:
  # 暴风舰天空体 + 先知骚扰(默认,已实机验证)
  tempest:
    spawn:
      TEMPEST: {proportion: 1.0, priority: 0}
    core_structures: [GATEWAY, CYBERNETICSCORE, STARGATE, FLEETBEACON]
    upgrades:
      - TEMPESTGROUNDATTACKUPGRADE
      - PROTOSSAIRARMORSLEVEL1
      - PROTOSSAIRARMORSLEVEL2
    extra_production: {id: STARGATE, cap: 6, base: 1}
    chrono: {targets: [STARGATE], when: primary_pending}
    one_off: [ORACLE]
    freeflow: true
    pivot:                          # 自适应机制(反rush/反空军,2026-07 迭代)
      anti_air_units: [STALKER]     # 对面爆空军时混入的兵种
      anti_air_proportion: 0.3
      anti_air_trigger: 3           # 敌可见空军 ≥N 架触发
      rush_zealots: 4               # rush 时先出的叉子数

  # 纯追猎 blink 流(骨架,待跑局验证)
  stalker:
    spawn:
      STALKER: {proportion: 0.7, priority: 0}
      ZEALOT: {proportion: 0.3, priority: 1}
    core_structures: [GATEWAY, CYBERNETICSCORE, TWILIGHTCOUNCIL]
    upgrades:
      - WARPGATERESEARCH
      - BLINKTECH
      - PROTOSSGROUNDWEAPONSLEVEL1
      - PROTOSSGROUNDARMORSLEVEL1
      - PROTOSSSHIELDSLEVEL1
    extra_production: {id: GATEWAY, cap: 8, base: 2}
    chrono: {targets: [GATEWAY, TWILIGHTCOUNCIL], when: always}
    one_off: []
    rally_min_army: 14
    auto_expand: {at: 150, to: 2, when_workers: 18}
    freeflow: true

  # 航母黄金舰队(新,待跑局验证):科技链与暴风舰完全相同,航母主 C、暴风舰副 C
  carrier:
    spawn:
      CARRIER: {proportion: 0.7, priority: 0}
      TEMPEST: {proportion: 0.3, priority: 1}
    core_structures: [GATEWAY, CYBERNETICSCORE, STARGATE, FLEETBEACON]
    upgrades:                     # O10 补全:L1→L3 全链(空攻/空防前置=舰队航标已在链;
      - PROTOSSAIRWEAPONSLEVEL1   # 盾 L2/L3 前置=暮光议会,L1 完成后由守卫路径补建)。
      - PROTOSSAIRARMORSLEVEL1    # 顺序讲究:UpgradeController 遇到不可研究的项会
      - PROTOSSSHIELDSLEVEL1      # 截断后续,故 L1 在前、盾 L2/L3 垫底。
      - PROTOSSAIRWEAPONSLEVEL2   # 注:当前 melee 无航母容量/弹射升级可研究
      - PROTOSSAIRARMORSLEVEL2    # (CARRIERCARRIERCAPACITY 等枚举是 coop/旧版残留,O10 实证)。
      - PROTOSSAIRWEAPONSLEVEL3
      - PROTOSSAIRARMORSLEVEL3
      - PROTOSSSHIELDSLEVEL2
      - PROTOSSSHIELDSLEVEL3
    extra_production: {id: STARGATE, cap: 6, base: 1}
    chrono: {targets: [STARGATE], when: primary_pending}
    one_off: [ORACLE]
    freeflow: true
    save_up: 250                    # O5 憋气:航母占比落后时截断风暴生成,攒气等航母
    pre_fleet: {id: ZEALOT, cap: 6, per_enemy: 0.7, max: 20}   # E5-B 臂:0.5/16→0.7/20(基线 e4g-default 2-3)
    # E2 动态开矿(司令:有能力开到 4 矿):爆仓(农民 ≥ 22×基地数)或
    # 前线优势(我方 army supply ≥ 敌可见 + 12)时逐矿 +1,rush 期间不开
    auto_expand: {max_bases: 4, when_workers: 22, advantage_supply: 12}
    expansion_cannons: {min: 3, max: 8}   # E2 分矿塔数区间:3 + 敌可见作战单位//4,封顶 8
    pivot:                          # 自适应机制(反rush/反空军,2026-07 迭代)
      anti_air_units: [STALKER]
      anti_air_proportion: 0.3
      anti_air_trigger: 3
      rush_zealots: 4

  # 隐刀 rush(2026-07-21 落地):黑暗圣堂速出白打农民,对面出反隐就转运营
  dt:
    spawn:
      DARKTEMPLAR: {proportion: 1.0, priority: 0}
    core_structures: [GATEWAY, CYBERNETICSCORE, TWILIGHTCOUNCIL, DARKSHRINE]
    upgrades:
      - WARPGATERESEARCH
      - PROTOSSGROUNDWEAPONSLEVEL1
      - PROTOSSGROUNDWEAPONSLEVEL2
    extra_production: {id: GATEWAY, cap: 8, base: 2}
    chrono: {targets: [GATEWAY, TWILIGHTCOUNCIL], when: always}
    one_off: []
    freeflow: true
    rally_min_army: 4               # 攒 4 把刀再出门(DT 分批送死是头号死法)
    auto_expand: {at: 300, to: 2, when_workers: 18}   # rush 不成转运营的退路
    pivot:                          # rush 更脆叉子减半;对面空军起来混追猎兜底
      anti_air_units: [STALKER]
      anti_air_proportion: 0.3
      anti_air_trigger: 3
      rush_zealots: 2
