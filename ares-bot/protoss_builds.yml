# This file is optional and here as an example of how to activate the build runner
# FEEL FREE TO DELETE!!

# If playing as a different race, make a file similar to this but change filename:
# `zerg_builds.yml` or `terran_builds.yml`


# Save the game opening and result to disk?
# Setting to `True` allows Ares to select a new opening after defeat
UseData: True
# How should we choose a build? Cycle is the only option for now
BuildSelection: Cycle
# For each Race / Opponent ID choose a build selection
BuildChoices:
    # test_123 is active if Debug: True (set via a `config.yml` file)
    test_123:
        BotName: Test
        Cycle:
            - TempestRush

    Protoss:
        BotName: ProtossRace
        Cycle:
            - TempestRush

    Random:
        BotName: RandomRace
        Cycle:
            - TempestRush

    Terran:
        BotName: TerranRace
        Cycle:
            - TempestRush

    Zerg:
        BotName: ZergRace
        Cycle:
            - TempestRush

    # Can also use specific opponent ids (overrides race options above)
    a_bot_opponent_id_from_aiarena:
        BotName: QueenBot
        Cycle:
            - TempestRush

Builds:
    # O161: carrier 经济开局 —— TempestRush 只到 14 supply 且 ConstantWorkerProductionTill=0，
    # build order 完成后 bot 层不补农民，导致 8 分钟仍 20 农、舰队没钱。CarrierOpener
    # 把农民线拉到 34，让 build runner 持续产农到 mid-game，bot 层再接管。
    CarrierOpener:
        # O163c:ConstantWorkerProductionTill 34 让 runner 在科技步之间无限插农民,
        # 导致 GATEWAY 后 CYBERNETICCORE/STARGATE 永远排不上矿物。改为 0,
        # 农民全显式写入 build order,确保科技链按时落地。
        ConstantWorkerProductionTill: 0
        # 必须用单条 Python list（ares BuildOrderParser 不认 list-of-lists），
        # 所以写成 flow-style 单行 list。
        # O163:把 GATEWAY/CYBERNETICCORE/STARGATE 直接写进经济开局,
        # 避免 bot 层因扩张持有/presumed 把科技冻到 4 分半后仍零兵零科技。
        # O165:本机 SC2 环境 Protoss 开局只有 8 农民(非标准 12),原 build order
        # 从 supply 12 起触发,chrono 拖到 45s、stargate 拖到 6:33。全部阈值 -4,
        # 让 chrono/农民/建筑节奏对齐原本设计,保证 fleet 能成型。
        OpeningBuildOrder: ['8 chrono @ nexus', '8 worker', '9 worker', '10 worker', '11 supply', '11 worker', '12 worker', '13 gate', '14 worker', '15 worker', '16 supply', '16 worker', '17 worker', '18 core', '19 worker', '20 supply', '20 worker', '21 worker', '22 stargate', '23 worker', '24 supply', '24 worker', '25 worker', '26 worker', '27 worker', '28 supply', '28 worker', '29 worker', '30 worker']

    # O189:Zerg Timing/Rush 专用开局。O185 把 Stargate 写在 build order 末尾，
    # 结果 30 supply 的星门在单矿经济中吸走 150/150，二矿永远攒不出。
    # 改为只建地面防御（Forge/双门/2 叉/1 炮），星门/舰队航标由 bot 层
    # _build_flow_structures 在 transition 期间自动补（O186 已解冻舰队科技），
    # 把 build order 的矿物压力压到最低，给二矿留出资金。
    CarrierOpenerZergTiming:
        ConstantWorkerProductionTill: 0
        # O329-①(2026-08-18 司令拍板:速二矿 opener):O321 的「防御总量
        # 前置」 opener 把 forge+双塔+双电池+双兵营全塞主基,实证主基
        # 5-7 塔吃掉 290-350s 的 750+ 矿,Nexus 只能靠收入残差攒到
        # 360s+ 派工(落成 377-500s);而电脑 Zerg 二矿 119-150s(录像
        # 实测)——经济差从开矿时点滚起,15 轮调参胜率不动的总根。
        # 重写为「水晶→兵营→速二矿」的人类宗师节奏(司令观赛口径):
        # - 主基防御链(双塔/双电池)整体移出 opener:防御重心迁 2 矿,
        #   由 bot 层 O329-③ 分矿预置塔链(Nexus 在途即铺电+首塔)+
        #   O329-④ F2 迁矿(建造槽先喂分矿,主基塔归零)负责;
        # - Nexus 不写进 build order(选址/时机要读战场):由 bot 层
        #   O329-② 速二矿钉点(t≥105+矿≥400,开动 ≤120s 向电脑看齐,
        #   rush 确认 fuse 弃权走旧防御路径);
        # - forge(18)/core(19)保留在 Nexus 资金窗之后:forge 是分矿
        #   塔链前置,core 是电池/追猎前置;GW2(22)保留(波前双兵营
        #   叉子产能,o315 实证单兵营 4-5 叉是天花板);
        # - 叉 4 只(16/20/23/25):波前最低地面线,配合分矿 2 塔+电池
        #   +口袋地形(O328)接 305-320s 首波。
        OpeningBuildOrder: ['8 chrono @ nexus', '8 worker', '9 worker', '10 worker', '11 worker', '12 supply', '12 worker', '13 gate', '14 worker', '15 worker', '16 supply', '16 zealot', '17 worker', '18 forge', '19 core', '20 zealot', '20 supply', '21 worker', '22 gateway', '23 zealot', '24 worker', '24 supply', '25 zealot', '26 worker', '27 worker', '28 zealot', '28 supply', '29 worker']

    # O194:Zerg Rush 专用开局。O193 Rush game_01 实证 Timing 开局在 Rush 下
    # forge 07:25/首叉 08:14/首炮 08:44 才落地,狗群 03:20 已到家,物理空窗被滚雪球。
    # 把防御链(FORGE/GATEWAY/ZEALOT/PHOTONCANNON)全部提前 4-5 min,用早塔+早叉
    # 顶住首波;CYBERNETICCORE/STARGATE 仍后放,由 bot 层在 transition 退出后补。
    CarrierOpenerZergRush:
        ConstantWorkerProductionTill: 0
        # O195-①(o194-vh-zerg-rush game_01/03 实证):开局第一个 PYLON 在 10 supply
        # 触发,但派工瞬间下一个 PROBE 把 100 矿花掉,农民钉点空转 20s+。
        # 把 PYLON 推到 11 supply 且让 worker 先触发,避免等钱。
        # 同时把 CYBERNETICCORE/STARGATE 提前 1-2 supply,让舰队更早成型,
        # 对治 Rush 中盘 remax 大波(07:00 后 50+ supply 虫群)。
        # O200(o199b-vh-zerg-rush game_05 PaladinoTerminalLE 278s 被裸奔滚平):
        # 单塔+双叉在短 rush 距离图仍不足,forge 后连铺 2 塔(17/19 supply),
        # cyber/stargate 各后挪 1 supply 保早期防御硬底线。
        # O201(o200-vh-zerg-rush 3-7 实证):首塔 timing 波动 2:33-4:29,forge 后
        # 插 worker/pylon 过多导致 photoncannon 被延迟;把双塔紧挨 forge,
        # 中间只插 1 个 worker,确保首塔 ≤2:30、第二塔 ≤3:00。
        # O202(o201-vh-zerg-rush 0-4 实证):"中间只插 1 个 worker"仍不够,
        # build order 实际在 forge 与首塔、首塔与二塔之间各插了 1 个 worker,
        # game_03 首塔 2:54/二塔 5:21。直接移除 forge 后的所有 worker,
        # 让 forge→首塔→二塔→supply 连续落地,worker 在二塔/supply 后再补。
        # O211(o210-vh-zerg-rush 全 lane idle_builder 实证):forge 后连拍 2 塔，
        # 塔工比 forge 早到 15-20s，在塔点干等 forge 完工，每局触发 200-600 次
        # idle_builder。在 forge 与双塔之间各插 1 个 worker，让 forge 基本就绪再派
        # 塔工，同时不显著拖慢防御链。
        OpeningBuildOrder: ['8 chrono @ nexus', '8 worker', '9 worker', '10 worker', '11 supply', '11 worker', '12 gate', '12 worker', '13 worker', '14 forge', '15 worker', '16 photoncannon', '17 worker', '18 photoncannon', '19 supply', '19 worker', '20 worker', '21 zealot', '22 worker', '23 zealot', '24 worker', '25 supply', '25 worker', '26 core', '27 worker', '28 stargate', '29 worker', '30 worker', '31 worker', '32 supply']

    TempestRush:
        # Build constant workers till x supply
        ConstantWorkerProductionTill: 0
        OpeningBuildOrder:
            # Example: ['12 worker', '13 worker', '14 supply', '14 worker', '15 chrono @ nexus',
            #           '15 worker', '16 gateway']
            # See docs: https://aressc2.github.io/ares-sc2/tutorials.html#build-runner-system
            # O142(o141-zerg-rush 局3 实证):runner 的 supply 触发与 bot 层
            # 农民冻结互锁成环 —— runner 等 supply≥14 才建 forge、probes 被
            # sprint 冻结永远到不了 14、forge 不建 sprint 不结束。开局只留
            # 农民+水晶，forge/GW/塔全部归 presumed/防御链管（bot 层时序
            # 不受 supply 触发约束）。
            ['12 chrono @ nexus', '12 worker', '13 worker', '14 supply']
